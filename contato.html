<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio">
    <meta name="author" content="Juliana Matos">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Contato</title>
</head>

<body>

    <header>
        <div class="profile-card">
            <img src="assets/img/perfil.jpg" alt="Foto Perfil">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">🏠 Home</a></li>
            </ul>
        </nav>

        <h1>📲 Contato</h1>
    </header>

    <main class="main_contato">

        <section class="form-wrapper">

            <div class="form-title-card">
                <h2>Envie uma mensagem</h2>
                <p>Ficarei feliz em conversar com você 💙</p><br><br>
            </div>

            <form action="" method="post" id="formulario">

                <label for="name">Nome</label>
                <input type="text" id="name" name="name" placeholder="Digite seu nome" required>
                <span id="error-name"></span>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                <span id="error-email"></span>

                <label for="subject">Assunto</label>
                <input type="text" id="subject" name="subject" placeholder="Digite o assunto" required>
                <span id="error-subject"></span>

                <label for="message">Mensagem</label>
                <textarea id="message" name="message" placeholder="Digite sua mensagem" required></textarea>
                <span id="error-message"></span>

                <button type="submit">Enviar</button>
            </form>

        </section>

        <article class="article_mapa">
            <h2>Localização</h2>

            <address>
                <p>Rua Endres</p>
                <p>Guarulhos - SP</p>
            </address>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3659.3242830482523!2d-46.55436607467214!3d-23.484826428852458!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5f8108aa4fe5%3A0x8d374f020da12cfa!2sR.%20Endres%2C%20973%20-%20Guarulhos%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1767630646342"
                loading="lazy" allowfullscreen>
            </iframe>
        </article>

    </main>

    <footer>
        <section>
            <a href="https://www.linkedin.com" target="_blank">
                <img src="assets/img/linkedin.png" alt="LinkedIn">
            </a>
            <a href="https://github.com" target="_blank">
                <img src="assets/img/github.png" alt="GitHub">
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <img src="assets/img/instagram.png" alt="Instagram">
            </a>
        </section>

        <h3>Desenvolvido por Juliana 🤍 2026</h3>
    </footer>

    <script src="assets/js/script.js"></script>

</body>

</html>
